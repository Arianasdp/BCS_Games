        <div class="cards-row">
    
            <div class="card-container">
                <img class="card" [src]="currentCard.image" />
            </div>

            <div class="deck">
                <img class="card" [src]="deck" />
            </div>

        </div>

        <div class="controls">
            <button (click)="guess('higher')" [disabled]="gameOver">▲</button>
            <button (click)="guess('lower')" [disabled]="gameOver">▼</button>
        </div>

        @if (nextCard) {
            <div class="next-card">
                <img class="card" [src]="nextCard.image" />
            </div>
        }

        <div class="score">
        <p>Score: {{ score }}</p>
        </div>

        @if (gameOver) {
        <div class="overlay">
            <div class="popup">
                <p>Game Over</p>
            <button (click)="resetGame()" class="reset-btn">Restart</button>
            </div>
        </div>}
</div>
